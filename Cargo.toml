[package]
  authors       = ["Eric Evans <ciresnave@gmail.com>"]
  categories    = ["authentication", "web-programming"]
  description   = "A comprehensive, production-ready authentication and authorization framework for Rust applications"
  documentation = "https://docs.rs/auth-framework"
  edition       = "2024"
  exclude       = [
    # Audit / dev-only docs
    "CRITICAL_SECURITY_AUDIT_REPORT.md",
    "COMPREHENSIVE_AUDIT_RC18.md",
    "COMPREHENSIVE_AUDIT_*.md",
    "REMEDIATION_PLAN.md",
    "RE_AUDIT_*.md",
    "FEATURE_FLAGS.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "COMPATIBILITY.md",
    # CI / release config
    "cliff.toml",
    "deny.toml",
    "redocly.yaml",
    ".markdownlint.json",
    "/.github/",
    # Docker / infrastructure
    "Dockerfile*",
    "docker-compose*",
    "/docker/",
    "/k8s/",
    "/monitoring/",
    "/nginx/",
    # Dev scripts and SDKs
    "/scripts/",
    "/sdks/",
    "/e2e/",
    # Docs subdirs not needed in crate
    "/docs/archives/",
    "/docs/quality/",
    "/docs/development/",
    # Test / migration artifacts
    "/migration/",
    "/benches/",
    # Static assets (admin GUI)
    "/static/",
    # Misc dev files
    ".env.example",
    "err*.txt",
    "auth-framework.png",
    "*.profraw",
    # Build log / analysis output files
    "build_*.txt",
    "check_*.txt",
    "cargo_check_*.txt",
    "clippy_*.txt",
  ]
  keywords      = ["auth", "authentication", "authorization", "jwt", "oauth"]
  license       = "MIT OR Apache-2.0"
  name          = "auth-framework"
  readme        = "README.md"
  repository    = "https://github.com/ciresnave/auth-framework"
  rust-version  = "1.88"
  version       = "0.6.0-rc3"

[[bin]]
  name              = "auth-framework"
  path              = "src/bin/server.rs"
  required-features = ["api-server"]

[[bin]]
  name              = "auth-framework-admin"
  path              = "src/bin/admin.rs"
  required-features = ["admin-binary"]

[[bin]]
  name              = "test_oauth2"
  path              = "src/bin/test_oauth2.rs"
  required-features = ["api-server"]

[dependencies]
  # Async runtime
  tokio = { version = "1.47.1", features = ["full"] }

  # JWT handling.
  #
  # WARNING FOR WHOEVER NEXT TRIES TO SLIM THESE FEATURES: listing
  # jsonwebtoken's sub-dependencies individually (ed25519-dalek, hmac,
  # p256, p384, rand, sha2 -- omitting "rust_crypto" itself, to try to
  # exclude "rsa") PASSES `cargo check` cleanly. It also ships a crate
  # that PANICS AT RUNTIME on the very first JWT sign or verify call, of
  # ANY algorithm, because jsonwebtoken's `CryptoProvider::get_default()`
  # requires "rust_crypto" or "aws_lc_rs" to be enabled BY LITERAL NAME
  # (see jsonwebtoken 10.3.0's src/crypto/mod.rs) -- the individual
  # sub-dependency features satisfy the compiler but never set that flag.
  # A green `cargo check` on a configuration that cannot run is exactly
  # the "looks done, isn't" defect this portfolio keeps re-discovering.
  # Caught by reading jsonwebtoken's own source, not by trusting the
  # build -- do the same before changing this again.
  #
  # Consequence for RSA specifically: "rust_crypto" is Cargo-feature-
  # defined as ["ed25519-dalek","hmac","p256","p384","rand","rsa","sha2"]
  # -- a single feature that unconditionally enables ALL of those,
  # including "rsa". Cargo features are pure unions; there is no way to
  # request that bundle minus "rsa". So jsonwebtoken's own RS*/PS* JWT
  # algorithm support (and the `rsa` crate it depends on) CANNOT be
  # feature-gated out of the default build without switching the crypto
  # backend to aws_lc_rs for ALL algorithms (a separate, larger change,
  # not done here -- see the portfolio roadmap). `rsa-key-ops` (below)
  # gates auth-framework's OWN direct `rsa` crate usage instead: the JARM
  # RSA-OAEP JWE path (the confirmed attacker-reachable exposure) and RSA
  # JWKS export. It does NOT remove `rsa` from this crate's dependency
  # tree -- see the `rsa-key-ops` feature comment below for what it does
  # and does not do.
  jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }

  # HTTP client for OAuth flows
  reqwest = { version = "0.13.2", features = ["json", "form"] }

  # Serialization
  serde      = { version = "1.0.228", features = ["derive"] }
  serde_json = "1.0.145"

  # Time handling
  chrono = { version = "0.4.42", features = ["serde"] }

  # UUID generation
  uuid = { version = "1.18.1", features = ["serde", "v4"] }

  # Email validation
  email_address = "0.2"

  # Additional format support for migration
  # Note: serde_yaml 0.9.x uses unsafe-libyaml (safe) rather than libyml (RUSTSEC-2025-0067/0068)
  serde_yaml = "0.9"
  toml       = "0.9"

  # Configuration management
  config = { version = "0.15.18", default-features = false, features = [
    "ini",
    "json",
    "ron",
    "toml",
    "yaml",
  ] }

  # Error handling
  anyhow    = "1.0.100"
  thiserror = "2.0.17"

  # Async trait support
  async-trait = "0.1.92"

  # Cryptography
  rand = { version = "0.10.0", features = ["std_rng"] }
  rand_core = "0.6"  # Compatible version for rsa crate's OsRng
  ring = "0.17.14"
  # Optional: only pulled in by the `rsa-key-ops` feature. Has an open,
  # unpatched timing-sidechannel advisory (RUSTSEC-2023-0071) -- see deny.toml
  # for the full disposition and CireSnave's 2026-09-24 ruling.
  rsa = { version = "0.9", features = ["sha2"], optional = true }  # RSA-OAEP for JWE key wrapping

  # Time handling
  time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }

  # Logging and tracing
  log                = "0.4.28"
  tracing            = "0.1.41"
  tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

  # URL handling
  url = "2.5.7"

  # Base64 encoding
  base64 = "0.22.1"

  # Base58 encoding (DID resolution)
  bs58 = "0.5"

  # MaxMind GeoIP2 for IP geolocation
  maxminddb = "0.27.3"

  # Threat intelligence integration
  csv                  = "1.3.1"  # For parsing threat feeds
  dirs                 = "6.0"  # For finding config directories
  ipnetwork            = "0.21" # For CIDR network parsing
  tokio-cron-scheduler = "0.15.0" # For automated feed updates

  # Hex encoding
  hex = "0.4.3"

  # SHA-2 hashing (for OAuth 2.0 PKCE and other server features)
  sha2 = "0.10.9"

  # MD5 hashing (for RADIUS RFC 2865 wire compatibility)
  md5 = { package = "md-5", version = "0.10" }

  # SHA-1 hashing (for WS-Security password digest)
  sha1 = "0.10"

  # HMAC for TOTP and other authentication schemes
  hmac = "0.12"

  # AES block cipher (for Kerberos AES-CTS-HMAC-SHA1-96)
  aes = "0.8"

  # Password hashing
  argon2 = "0.5.3"
  bcrypt = "0.19.0"

  # Enterprise RBAC system
  role-system = { version = "1.1.1", optional = true, features = [
    "async",
    "audit",
    "persistence",
  ] }

  # Optional Redis support
  redis = { version = "1.0.4", optional = true, features = [
    "aio",
    "tokio-comp",
  ] }

  # Rate limiting
  governor    = "0.10.1"
  nonzero_ext = "0.3.0"

  # TOTP authentication
  totp-lite = "2.0.1"

  # Base32 encoding for TOTP
  base32 = "0.5.1"

  # URL encoding utilities
  urlencoding = "2.1.3"

  # X.509 certificate generation
  rcgen = "0.14"

  # X.509 certificate parsing for OAuth 2.0 Mutual TLS (RFC 8705)
  x509-parser = "0.18.0"

  # X.509 certificate chain validation (production-grade)
  rustls-webpki = "0.103.11"

  # Fast CRC32 calculation
  crc32fast = "1.3"

  # Memory protection and zeroization
  zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

  # Constant-time comparisons
  subtle = "2.5"

  # Static variable initialization
  lazy_static = "1.5.0"

  # High-performance concurrent data structures
  dashmap = "6.1"

  # Secret management
  secrecy = { version = "0.10.3", features = ["serde"] }

  # System information (disk, memory, CPU) for health metrics
  sysinfo = "0.32"

  # Performance and Observability enhancements
  metrics = { version = "0.24.2", optional = true }
  metrics-prometheus = { version = "0.11", optional = true }
  opentelemetry = { version = "0.31.0", features = ["trace"], optional = true }
  # opentelemetry-jaeger removed: unmaintained (RUSTSEC-2025-0123).
  # Use opentelemetry-otlp instead — Jaeger 1.35+ accepts OTLP natively.
  opentelemetry-otlp = { version = "0.31.0", optional = true }
  opentelemetry-prometheus = { version = "0.31.0", optional = true }
  opentelemetry_sdk = { version = "0.32.1", features = [
    "trace",
  ], optional = true }
  prometheus = { version = "0.14.0", optional = true }
  tracing-opentelemetry = { version = "0.32.0", optional = true }

  # Event sourcing and streaming
  futures      = { version = "0.3.31", optional = true }
  tokio-stream = { version = "0.1.17", optional = true }

  # Configuration hot-reload
  notify = { version = "8.2.0", optional = true }

  # Memory pool optimization
  bumpalo     = { version = "3.14", optional = true }
  object-pool = { version = "0.6.0", optional = true }

  # OAuth device flows (optional enhanced device flow support)
  oauth-device-flows = { version = "0.1.0", optional = true }

  # OpenID Connect support (optional) - Updated to fix RSA dependency
  openidconnect = { version = "4.0.1", optional = true }

  # Archive extraction for threat intelligence feeds (tar.gz, zip)
  flate2 = "1"
  tar    = "0.4.45"
  zip    = "2"

  # Email delivery for alert notifications
  lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1-rustls-tls",
  ] }

  # Missing dependencies for 100% completion
  ldap3                 = { version = "0.12.1", optional = true }
  otpauth               = { version = "0.5.1", optional = true }  # Updated to latest available
  unicode-normalization = { version = "0.1", optional = true }

  # CLI dependencies
  clap      = { version = "4.5.48", features = ["derive"], optional = true }
  rpassword = { version = "7.4.0", optional = true }

  # TUI dependencies
  crossterm = { version = "0.29.0", optional = true } # Updated to maintain compatibility
  ratatui   = { version = "0.30.0", optional = true } # Updated to latest version
  tui-input = { version = "0.15.0", optional = true }

  # Additional utility dependencies
  colored   = { version = "3.0", optional = true }
  console   = { version = "0.16.1", optional = true }
  dialoguer = { version = "0.12", optional = true }
  indicatif = { version = "0.18", optional = true }

  # Web framework dependencies
  futures-util = { version = "0.3.31", optional = true }

  # Template engine for web GUI
  askama = { version = "0.15.4", optional = true }
  # Note: askama_axum was removed in askama 0.13+ - axum integration is now built into askama

  # XML processing for SAML
  quick-xml = { version = "0.41.0", features = ["serialize"], optional = true }

  # XML-DSig signature validation for SAML
  bergshamra = { version = "0.3", optional = true }
  p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
  p384 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }

  # Passkey/WebAuthn dependencies
  coset          = { version = "0.4.2", optional = true } # Keep aligned with passkey's coset dependency
  passkey        = { version = "0.5.0", optional = true } # Updated to latest version
  passkey-client = { version = "0.5.0", optional = true } # Updated to latest version

  # Web framework integrations (optional)
  actix-web = { version = "4.11.0", optional = true }
  axum = { version = "0.8.6", features = ["macros"], optional = true }
  serde_urlencoded = { version = "0.7", optional = true }
  tower = { version = "0.5.2", features = ["util"], optional = true }
  tower-http = { version = "0.6.6", features = [
    "cors",
    "fs",
    "trace",
  ], optional = true }
  warp = { version = "0.4.2", features = ["server", "test"], optional = true }

  # Database integrations (optional) - Updated sqlx to fix RSA vulnerability
  sqlx = { version = "0.8.6", features = [
    "chrono",
    "mysql",
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
  ], optional = true }
  tokio-postgres = { version = "0.7.14", optional = true }

  # Testing infrastructure (optional)
  html-escape    = "0.2.13"
  testcontainers = { version = "0.27.2", optional = true }

  # SMSKit dependencies for next-gen SMS support
  regex           = "1.11.3"
  sms-core        = { version = "0.3.0", optional = true }
  sms-plivo       = { version = "0.3.0", optional = true }
  sms-twilio      = { version = "0.3.0", optional = true }
  sms-web-axum    = { version = "0.3.0", optional = true }
  sms-web-generic = { version = "0.3.0", optional = true }
cryptoki = { version = "0.12.0", optional = true }
pasetors = "0.7.7"

[dev-dependencies]
  axum-test  = "19.1.1"
  criterion  = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
  fastrand   = "2.0"
  mockito    = "1.2"
  tempfile   = "3.23.0"
  test-log   = "0.2"
  tokio-test = "0.4.4"

[features]
  default = [
    "enhanced-rbac",    # Re-enabled for comprehensive authorization testing
    "postgres-storage",
  ] # PostgreSQL recommended
  enhanced-device-flow = ["oauth-device-flows"]
  mysql-storage = ["sqlx"]
sqlite-storage = ["sqlx"]
  openid-connect = ["openidconnect"]
  postgres-storage = ["sqlx", "tokio-postgres"]
  redis-storage = ["redis"]
  # Enhanced cryptography features
  distributed-rate-limiting = ["redis"]
  # Reserved for future enhanced cryptographic operations — currently a no-op
  enhanced-crypto           = ["chacha20poly1305", "ed25519-dalek", "x25519-dalek"]
  fips-compliance           = ["aws-lc-rs"]

  # Enterprise RBAC with role-system v1.0
  enhanced-rbac = ["api-server", "role-system"]

  # Additional features referenced in code
  actix-integration = ["actix-web", "futures-util"]
  admin-binary = ["cli", "tui", "web-gui"]
  api-server = ["axum", "tower", "tower-http"]
  axum-integration = ["axum", "serde_urlencoded", "tower", "tower-http"]
  cli = [
    "clap",
    "colored",
    "console",
    "dialoguer",
    "indicatif",
    "rpassword",
    "tokio-postgres",
  ]
  docker-tests = ["testcontainers"]
  ldap-auth = ["ldap3"]
  otp-auth = ["otpauth"]
  passkeys = ["coset", "passkey", "passkey-client"]
  hsm = ["cryptoki"]  # PKCS#11 / HSM integration for X.509 certificate loading
  saml = ["bergshamra", "p256", "p384", "quick-xml", "rsa-key-ops"] # most SAML IdP certs are RSA
  # WHAT THIS GATES: auth-framework's own direct `rsa` crate usage --
  # JARM's RSA-OAEP JWE decrypt/encrypt (oidc_advanced_jarm.rs; the
  # confirmed attacker-reachable path: the public `validate_jarm_response`
  # API feeds an external token directly into an RSA private-key decrypt)
  # and RSA JWKS export (tokens/mod.rs). With this feature OFF, both
  # return an actionable error naming RUSTSEC-2023-0071 instead of
  # silently working.
  #
  # WHAT THIS DOES NOT GATE, AND WHY: `rsa` v0.9.10 remains present in
  # EVERY default build regardless of this feature. jsonwebtoken's own
  # RS*/PS* JWT sign+verify pulls in its own `rsa` dependency via its
  # "rust_crypto" feature bundle
  # (rust_crypto = ["ed25519-dalek","hmac","p256","p384","rand","rsa","sha2"]),
  # which is also required for ES256/EdDSA/HMAC to work at all --
  # jsonwebtoken panics at runtime (`CryptoProvider::get_default()`)
  # unless "rust_crypto" or "aws_lc_rs" is enabled by literal name, and
  # Cargo features are pure unions: there is no way to request the
  # "rust_crypto" bundle minus its "rsa" member. Confirmed via
  # `cargo tree -e features -i rsa` (rsa still resolves with this feature
  # off) and by reading jsonwebtoken 10.3.0's own source, not assumed.
  # `cargo audit`/`cargo-deny` will therefore keep reporting `rsa` in this
  # crate's dependency tree unconditionally -- that is correct, not a bug
  # in this gate. Removing `rsa` from default builds entirely would
  # require switching jsonwebtoken to its `aws_lc_rs` backend for ALL
  # algorithms (a separate, larger change: different build toolchain
  # requirements, not just an RSA change) -- not done here; see the
  # portfolio roadmap.
  #
  # ECDSA (ES256/ES384) is the recommended default for new JWT
  # configurations (see security/presets.rs) and does not exercise the
  # vulnerable RSA code path even though the crate remains compiled in.
  rsa-key-ops = ["dep:rsa"]
  tui = ["colored", "console", "crossterm", "indicatif", "ratatui", "tui-input"]
  unicode-support = ["unicode-normalization"]
  warp-integration = ["warp"]
  web-gui = ["askama", "axum", "serde_urlencoded", "tower", "tower-http"]

  # Enhanced performance and observability
  config-hot-reload = ["notify"]
  enhanced-observability = [
    "futures",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry-prometheus",
    "tokio-stream",
    "tracing-opentelemetry",
  ]
  event-sourcing = ["futures", "notify", "tokio-stream"]
  performance-optimization = [
    "bumpalo",
    "metrics",
    "metrics-prometheus",
    "object-pool",
    "prometheus",
  ]
  tiered-storage = ["postgres-storage", "redis"]

  # SMSKit integration (next-generation SMS support)
  smskit = [
    "sms-core",
    "sms-plivo",
    "sms-twilio",
    "sms-web-generic",
  ]
  smskit-web-axum = ["axum-integration", "sms-web-axum", "smskit"]

  # AES-GCM encryption (always on — required by storage encryption and JARM)
  [dependencies.aes-gcm]
    version = "0.10.3"

  [dependencies.chacha20poly1305]
    optional = true
    version  = "0.10"

  [dependencies.x25519-dalek]
    optional = true
    version  = "2.0"
    features = ["static_secrets"]

  [dependencies.ed25519-dalek]
    features = ["rand_core"]
    optional = true
    version  = "2.2.0"

  [dependencies.aws-lc-rs]
    features = ["aws-lc-sys"]
    optional = true
    version  = "1.14.1"

  [dependencies.parking_lot]
    version = "0.12.5"

  [dependencies.getrandom]
    features = ["std"]
    version  = "0.4.2"

[[bench]]
  harness = false
  name    = "auth_performance"

[[example]]
  name = "performance_demo"
  required-features = [
    "enhanced-observability",
    "event-sourcing",
    "performance-optimization",
  ]

[[example]]
  name              = "complete_rest_api_server"
  path              = "examples/complete_rest_api_server.rs"
  required-features = ["api-server"]

[[example]]
name = "axum_integration"
required-features = ["axum-integration"]
