[package]
  authors       = ["Eric Evans <ciresnave@gmail.com>"]
  categories    = ["authentication", "web-programming"]
  description   = "A comprehensive, production-ready authentication and authorization framework for Rust applications"
  documentation = "https://docs.rs/auth-framework"
  edition       = "2024"
  exclude       = [
    # Audit / dev-only docs
    "CRITICAL_SECURITY_AUDIT_REPORT.md",
    "COMPREHENSIVE_AUDIT_RC18.md",
    "COMPREHENSIVE_AUDIT_*.md",
    "REMEDIATION_PLAN.md",
    "RE_AUDIT_*.md",
    "FEATURE_FLAGS.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "COMPATIBILITY.md",
    # CI / release config
    "cliff.toml",
    "deny.toml",
    "redocly.yaml",
    ".markdownlint.json",
    "/.github/",
    # Docker / infrastructure
    "Dockerfile*",
    "docker-compose*",
    "/docker/",
    "/k8s/",
    "/monitoring/",
    "/nginx/",
    # Dev scripts and SDKs
    "/scripts/",
    "/sdks/",
    "/e2e/",
    # Docs subdirs not needed in crate
    "/docs/archives/",
    "/docs/quality/",
    "/docs/development/",
    # Test / migration artifacts
    "/migration/",
    "/benches/",
    # Static assets (admin GUI)
    "/static/",
    # Misc dev files
    ".env.example",
    "err*.txt",
    "auth-framework.png",
    "*.profraw",
    # Build log / analysis output files
    "build_*.txt",
    "check_*.txt",
    "cargo_check_*.txt",
    "clippy_*.txt",
  ]
  keywords      = ["auth", "authentication", "authorization", "jwt", "oauth"]
  license       = "MIT OR Apache-2.0"
  name          = "auth-framework"
  readme        = "README.md"
  repository    = "https://github.com/ciresnave/auth-framework"
  rust-version  = "1.89"
  version       = "0.6.0-rc19"

[workspace]
  # auth-storage-sqlite shares this crate's Cargo.lock/resolution so it
  # comes under every existing CI job (test, clippy, coverage, audit,
  # deny) instead of being silently unbuilt and unaudited (see #56).
  members = ["auth-storage-sqlite"]

[[bin]]
  name              = "auth-framework"
  path              = "src/bin/server.rs"
  required-features = ["api-server"]

[[bin]]
  name              = "auth-framework-admin"
  path              = "src/bin/admin.rs"
  required-features = ["admin-binary"]

[[bin]]
  name              = "test_oauth2"
  path              = "src/bin/test_oauth2.rs"
  required-features = ["api-server"]

[dependencies]
  # Async runtime
  tokio = { version = "1.47.1", features = ["full"] }

  # JWT handling.
  #
  # Backed by jsonwebtoken's "aws_lc_rs" crypto provider, not "rust_crypto".
  # "rust_crypto" is Cargo-feature-defined as
  # ["ed25519-dalek","hmac","p256","p384","rand","rsa","sha2"] -- a single
  # feature that unconditionally enables ALL of those, including the `rsa`
  # crate (RUSTSEC-2023-0071, an open, unpatched RSA timing sidechannel --
  # see deny.toml's prior disposition of it). "aws_lc_rs" covers the exact
  # same Algorithm set (RS*/PS*/ES*/EdDSA/HS*, confirmed against
  # jsonwebtoken 10.4.0's src/crypto/aws_lc/*.rs match arms) through AWS-LC
  # (a BoringSSL-derived C/assembly implementation), which is not the `rsa`
  # crate and is not subject to this advisory.
  #
  # WARNING FOR WHOEVER NEXT TOUCHES THIS: jsonwebtoken's
  # `CryptoProvider::get_default()` requires "rust_crypto" or "aws_lc_rs"
  # to be enabled BY LITERAL NAME (see jsonwebtoken's src/crypto/mod.rs) --
  # listing sub-dependencies individually instead passes `cargo check`
  # cleanly but PANICS AT RUNTIME on the very first JWT sign or verify
  # call, of any algorithm. Caught by reading jsonwebtoken's own source,
  # not by trusting the build -- do the same before changing this again.
  jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }

  # HTTP client for OAuth flows
  reqwest = { version = "0.13.2", features = ["json", "form"] }

  # Serialization
  serde      = { version = "1.0.228", features = ["derive"] }
  serde_json = "1.0.145"

  # Time handling
  chrono = { version = "0.4.42", features = ["serde"] }

  # UUID generation
  uuid = { version = "1.18.1", features = ["serde", "v4"] }

  # Email validation
  email_address = "0.2"

  # Additional format support for migration
  # Note: serde_yaml 0.9.x uses unsafe-libyaml (safe) rather than libyml (RUSTSEC-2025-0067/0068)
  serde_yaml = "0.9"
  toml       = "1"

  # Configuration management
  config = { version = "0.15.18", default-features = false, features = [
    "ini",
    "json",
    "ron",
    "toml",
    "yaml",
  ] }

  # Error handling
  anyhow    = "1.0.100"
  thiserror = "2.0.17"

  # Async trait support
  async-trait = "0.1.92"

  # Cryptography
  rand = { version = "0.10.0", features = ["std_rng"] }
  rand_core = "0.6"
  ring = "0.17.14"
  # The `rsa` crate (RUSTSEC-2023-0071) is not a DIRECT dependency of this
  # crate, and is absent from every DEFAULT-feature build: jsonwebtoken's
  # RS*/PS* and auth-framework's own RSA JWKS export / JARM RSA-OAEP JWE
  # were rewritten against `aws-lc-rs`, `mysql-storage` (sqlx-mysql's own
  # path) has been removed entirely, and `saml`'s need for it via
  # bergshamra 0.3.x's `KeyData::Rsa` variant is gone as of bergshamra
  # >=0.9.2's `aws-lc` feature. The `openid-connect` feature used to pull it
  # in through the `openidconnect` crate (a hard, non-optional dependency in
  # openidconnect's own Cargo.toml, #113); nothing in this crate called that
  # crate, so the dependency was removed and the feature is now a no-op alias.
  # `rsa` is still LISTED in Cargo.lock via the `sqlx-mysql` 0.8.6 stub entry
  # (it is in no resolved dependency graph: `cargo tree -i rsa --all-features
  # --target all` prints nothing) until sqlx 0.9 is taken; see deny.toml's
  # RUSTSEC-2023-0071 entry. The "Security Audit (rsa absence)" CI job
  # enforces absence for every shipped feature combination.

  # Time handling
  time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }

  # Logging and tracing
  log                = "0.4.28"
  tracing            = "0.1.41"
  tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

  # URL handling
  url = "2.5.7"

  # Base64 encoding
  # default-features off: base64 0.23 makes the `simd-unsafe` engines a default feature;
  # this crate only uses the scalar `GeneralPurpose` engines (STANDARD, URL_SAFE_NO_PAD, ...).
  base64 = { version = "0.23", default-features = false, features = ["std"] }

  # Base58 encoding (DID resolution)
  bs58 = "0.5"

  # MaxMind GeoIP2 for IP geolocation
  maxminddb = "0.32"

  # Threat intelligence integration
  csv                  = "1.3.1"  # For parsing threat feeds
  dirs                 = "7"  # For finding config directories
  ipnetwork            = "0.21" # For CIDR network parsing
  tokio-cron-scheduler = "0.15.0" # For automated feed updates

  # Hex encoding
  hex = "0.4.3"

  # SHA-2 hashing (for OAuth 2.0 PKCE and other server features)
  sha2 = "0.10.9"

  # MD5 hashing (for RADIUS RFC 2865 wire compatibility)
  md5 = { package = "md-5", version = "0.10" }

  # SHA-1 hashing (for WS-Security password digest)
  sha1 = "0.10"

  # HMAC for TOTP and other authentication schemes
  hmac = "0.12"

  # AES block cipher (for Kerberos AES-CTS-HMAC-SHA1-96)
  aes = "0.8"

  # Password hashing
  argon2 = "0.5.3"
  bcrypt = "0.19.0"

  # Enterprise RBAC system
  role-system = { version = "1.1.1", optional = true, features = [
    "async",
    "audit",
    "persistence",
  ] }

  # Optional Redis support
  redis = { version = "1.0.4", optional = true, features = [
    "aio",
    "tokio-comp",
  ] }

  # Rate limiting
  governor    = "0.10.1"
  nonzero_ext = "0.3.0"

  # TOTP authentication
  totp-lite = "2.0.1"

  # Base32 encoding for TOTP
  base32 = "0.5.1"

  # URL encoding utilities
  urlencoding = "2.1.3"

  # X.509 certificate generation. `aws_lc_rs` feature needed for RSA test-key
  # generation (ring, rcgen's default backend, has no RSA keygen support:
  # https://github.com/briansmith/ring/issues/219) -- aws-lc-rs is already a
  # dependency of this crate via jsonwebtoken/kryptering, so this adds no new
  # crypto backend, just lets rcgen use the one already in the tree.
  rcgen = { version = "0.14", features = ["aws_lc_rs"] }

  # X.509 certificate parsing for OAuth 2.0 Mutual TLS (RFC 8705)
  x509-parser = "0.18.0"

  # X.509 certificate chain validation (production-grade)
  rustls-webpki = "0.103.11"

  # Fast CRC32 calculation
  crc32fast = "1.3"

  # Memory protection and zeroization
  zeroize = { version = "1.8.2", features = ["zeroize_derive", "serde"] }

  # Constant-time comparisons
  subtle = "2.5"

  # Static variable initialization
  lazy_static = "1.5.0"

  # High-performance concurrent data structures
  dashmap = "6.1"

  # Secret management
  secrecy = { version = "0.10.3", features = ["serde"] }

  # System information (disk, memory, CPU) for health metrics
  sysinfo = "0.32"

  # Performance and Observability enhancements
  metrics = { version = "0.24.2", optional = true }
  metrics-prometheus = { version = "0.11", optional = true }
  opentelemetry = { version = "0.31.0", features = ["trace"], optional = true }
  # opentelemetry-jaeger removed: unmaintained (RUSTSEC-2025-0123).
  # Use opentelemetry-otlp instead — Jaeger 1.35+ accepts OTLP natively.
  opentelemetry-otlp = { version = "0.31.0", optional = true }
  opentelemetry-prometheus = { version = "0.31.0", optional = true }
  opentelemetry_sdk = { version = "0.32.1", features = [
    "trace",
  ], optional = true }
  prometheus = { version = "0.14.0", optional = true }
  tracing-opentelemetry = { version = "0.32.0", optional = true }

  # Event sourcing and streaming
  futures      = { version = "0.3.31", optional = true }
  tokio-stream = { version = "0.1.17", optional = true }

  # Configuration hot-reload
  notify = { version = "8.2.0", optional = true }

  # Memory pool optimization
  bumpalo     = { version = "3.14", optional = true }
  object-pool = { version = "0.6.0", optional = true }

  # OAuth device flows (optional enhanced device flow support)
  oauth-device-flows = { version = "0.1.0", optional = true }

  # Archive extraction for threat intelligence feeds (tar.gz, zip)
  flate2 = "1"
  tar    = "0.4.45"
  zip    = "2"

  # Email delivery for alert notifications
  lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1-rustls-tls",
  ] }

  # Missing dependencies for 100% completion
  ldap3                 = { version = "0.12.1", optional = true }
  otpauth               = { version = "0.5.1", optional = true }  # Updated to latest available
  unicode-normalization = { version = "0.1", optional = true }

  # CLI dependencies
  clap      = { version = "4.5.48", features = ["derive"], optional = true }
  rpassword = { version = "7.4.0", optional = true }

  # TUI dependencies
  crossterm = { version = "0.29.0", optional = true } # Updated to maintain compatibility
  ratatui   = { version = "0.30.0", optional = true } # Updated to latest version
  tui-input = { version = "0.15.0", optional = true }

  # Additional utility dependencies
  colored   = { version = "3.0", optional = true }
  console   = { version = "0.16.1", optional = true }
  dialoguer = { version = "0.12", optional = true }
  indicatif = { version = "0.18", optional = true }

  # Web framework dependencies
  futures-util = { version = "0.3.31", optional = true }

  # Template engine for web GUI
  askama = { version = "0.16", optional = true }
  # Note: askama_axum was removed in askama 0.13+ - axum integration is now built into askama

  # XML processing for SAML
  quick-xml = { version = "0.41.0", features = ["serialize"], optional = true }

  # XML-DSig signature validation for SAML. default-features = false,
  # features = ["aws-lc"]: bergshamra's default pulls in its own
  # "rustcrypto" feature, which depends on the `rsa` crate
  # (RUSTSEC-2023-0071) among others -- selecting "aws-lc" instead routes
  # bergshamra's crypto through aws-lc-rs (not subject to that advisory;
  # see the jsonwebtoken dependency comment above for the same backend).
  # Confirmed by reading bergshamra/bergshamra-keys/kryptering's own
  # Cargo.toml files at v0.9.2 that "aws-lc" never pulls `dep:rsa`.
  # legacy-algorithms/post-quantum/pkcs11 (also in bergshamra's default)
  # are deliberately left off: no current SAML use case needs weak-digest
  # interop, post-quantum XML-DSig, or PKCS#11-backed keys, and each adds
  # real dependency weight. See
  # `tests::test_bergshamra_feature_choices_are_deliberate` below, which
  # fails if this feature list drifts without updating that reasoning.
  bergshamra = { version = "0.9", default-features = false, features = [
    "aws-lc",
  ], optional = true }
  # Needed directly (not just transitively through bergshamra) to name
  # `kryptering::KeyAlgorithm`/`EcCurve` when importing a parsed X.509
  # certificate's public key via `KeyData::from_spki_der` (api/saml.rs) --
  # bergshamra's own public API re-exports `KeyData`/`Key` but not the
  # algorithm-selector types its constructors take.
  # default-features = false: kryptering's own default pulls its
  # "rustcrypto" feature (-> `dep:rsa`) same as bergshamra's does --
  # without this, enabling `saml` would reintroduce `rsa` through this
  # direct dependency even though bergshamra's own request above is for
  # "aws-lc" only. No extra features requested here: Cargo unions the
  # "aws-lc" feature bergshamra's own dependency edge already requests,
  # so this just needs to exist as a nameable crate for KeyAlgorithm/EcCurve.
  kryptering = { version = "0.6", default-features = false, optional = true }

  # Passkey/WebAuthn dependencies
  coset          = { version = "0.4.2", optional = true } # Keep aligned with passkey's coset dependency
  passkey        = { version = "0.5.0", optional = true } # Updated to latest version
  passkey-client = { version = "0.5.0", optional = true } # Updated to latest version

  # Web framework integrations (optional)
  actix-web = { version = "4.11.0", optional = true }
  axum = { version = "0.8.6", features = ["macros"], optional = true }
  serde_urlencoded = { version = "0.7", optional = true }
  tower = { version = "0.5.2", features = ["util"], optional = true }
  tower-http = { version = "0.7", features = [
    "cors",
    "fs",
    "trace",
  ], optional = true }
  warp = { version = "0.4.2", features = ["server", "test"], optional = true }

  # Database integrations (optional). Deliberately does NOT list "sqlite"
  # or "postgres" here -- those are enabled per-backend by
  # sqlite-storage/postgres-storage below (see those features' own
  # comments), not unconditionally by every build that turns on `sqlx` at
  # all. `mysql-storage` (and MySQL support generally) was removed
  # entirely -- sqlx-mysql's own `rsa` dependency (RUSTSEC-2023-0071) for
  # its caching_sha2_password auth-plugin was the last remaining path to
  # that crate in this codebase; see CHANGELOG.md for the migration note.
  sqlx = { version = "0.8.6", features = [
    "chrono",
    "runtime-tokio-rustls",
    "uuid",
  ], optional = true }
  tokio-postgres = { version = "0.7.14", optional = true }

  # Testing infrastructure (optional)
  html-escape    = "0.2.13"
  testcontainers = { version = "0.28", optional = true }

  # SMSKit dependencies for next-gen SMS support
  regex           = "1.11.3"
  sms-core        = { version = "0.3.0", optional = true }
  sms-plivo       = { version = "0.3.0", optional = true }
  sms-twilio      = { version = "0.3.0", optional = true }
  sms-web-axum    = { version = "0.3.0", optional = true }
  sms-web-generic = { version = "0.3.0", optional = true }
cryptoki = { version = "0.12.0", optional = true }
pasetors = "0.7.7"

[dev-dependencies]
  axum-test  = "21"
  criterion  = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
  fastrand   = "2.0"
  mockito    = "1.2"
  tempfile   = "3.23.0"
  test-log   = "0.2"
  tokio-test = "0.4.4"

[features]
  default = [
    "enhanced-rbac",    # Re-enabled for comprehensive authorization testing
    "postgres-storage",
  ] # PostgreSQL recommended
  enhanced-device-flow = ["oauth-device-flows"]
  # Each storage feature enables only its own sqlx sub-feature.
  sqlite-storage = ["dep:sqlx", "sqlx/sqlite"]
  # DEPRECATED no-op alias, kept so `features = ["openid-connect"]` keeps
  # resolving on the 0.6 rc line; remove before 1.0. It used to enable the
  # `openidconnect` crate, which no code in this crate used (#113).
  openid-connect = []
  postgres-storage = ["dep:sqlx", "sqlx/postgres", "tokio-postgres"]
  redis-storage = ["redis"]
  # Enhanced cryptography features
  distributed-rate-limiting = ["redis"]
  # Reserved for future enhanced cryptographic operations — currently a no-op
  enhanced-crypto           = ["chacha20poly1305", "ed25519-dalek", "x25519-dalek"]
  # Explicit alias preserving the feature name a consumer would have gotten
  # implicitly before any feature in this manifest used `dep:aws-lc-rs`
  # syntax -- without this, `features = ["aws-lc-rs"]` in a downstream
  # Cargo.toml would stop resolving (Opus review on #96 caught this).
  aws-lc-rs = ["dep:aws-lc-rs"]
  fips-compliance = ["aws-lc-rs"]

  # Enterprise RBAC with role-system v1.0
  enhanced-rbac = ["api-server", "role-system"]

  # Additional features referenced in code
  #
  # SECURITY: pulls in h2 0.3.27 transitively via actix-web -> actix-http,
  # which is affected by RUSTSEC-2026-0258 (unbounded empty DATA frames).
  # No fixed actix-http release exists yet (see SECURITY.md). Not exercised
  # by this crate itself -- only relevant if your own app runs an
  # actix_web::HttpServer with HTTP/2 enabled.
  actix-integration = ["actix-web", "futures-util"]
  admin-binary = ["cli", "tui", "web-gui"]
  api-server = ["axum", "tower", "tower-http"]
  axum-integration = ["axum", "serde_urlencoded", "tower", "tower-http"]
  cli = [
    "clap",
    "colored",
    "console",
    "dialoguer",
    "indicatif",
    "rpassword",
    "tokio-postgres",
  ]
  docker-tests = ["testcontainers"]
  ldap-auth = ["ldap3"]
  otp-auth = ["otpauth"]
  passkeys = ["coset", "passkey", "passkey-client"]
  hsm = ["cryptoki"]  # PKCS#11 / HSM integration for X.509 certificate loading
  # No longer needs `dep:rsa`: bergshamra 0.9.2's `aws-lc` feature (see
  # the bergshamra dependency's own comment above) replaced the 0.3.x
  # `KeyData::Rsa { public: rsa::RsaPublicKey, .. }` variant that used to
  # require the real `rsa` crate -- api/saml.rs::key_from_x509_der now
  # imports via `KeyData::from_spki_der(kryptering::KeyAlgorithm::Rsa, ..)`,
  # which routes through aws-lc-rs instead. Confirmed: `cargo tree -i rsa
  # --features saml` is empty as of this change.
  saml = ["dep:bergshamra", "dep:kryptering", "quick-xml"]
  # RSA split into two features, `rsa-verify` and `rsa-private-key-ops`, so a
  # consumer who only needs public-key verification (SAML, JWKS export) is
  # never forced to also compile in the private-key operation (JARM's
  # RSA-OAEP JWE decrypt). Formerly backed directly by the `rsa` crate
  # (RUSTSEC-2023-0071); now backed by `aws-lc-rs`, which implements RSA
  # independently (AWS-LC, a BoringSSL-derived C/assembly codebase) and is
  # not subject to that advisory. The opt-in-feature shape is unchanged
  # from CireSnave's 2026-09-24 ruling -- only the backend underneath it.
  #
  # `saml`'s own RSA usage (above) used to pull the real `rsa` crate
  # directly via bergshamra -- that's also gone now (bergshamra >=0.9.2's
  # `aws-lc` feature), so these two features and `saml` are independent
  # but no longer in tension the way they used to be.
  rsa-verify = ["dep:aws-lc-rs"]

  # RSA private-key operations: JARM's RSA-OAEP JWE decrypt AND encrypt
  # (oidc_advanced_jarm.rs), backed by aws-lc-rs (see rsa-verify's comment
  # above). Decrypt is the path that was the confirmed attacker-reachable
  # exposure under the `rsa` crate -- the public `validate_jarm_response`
  # API feeds an external token directly into a private-key decrypt.
  # aws-lc-rs's decrypt returns an opaque `Unspecified` error, uniform
  # across every failure AT THE RSA-OAEP LAYER (malformed ciphertext, wrong
  # padding, wrong key size) -- not end-to-end; see the test on
  # decrypt_rsa_oaep_a256gcm for what that does and does not cover. That's
  # the actual property this gate cares about, not just "a different
  # crate." Encrypt is bundled
  # here rather than under `rsa-verify` because it shares the same JWE
  # round-trip config, struct fields, and constructor logic as decrypt in
  # this file, not because encrypting with a public key is itself
  # dangerous -- it isn't.
  rsa-private-key-ops = ["dep:aws-lc-rs"]
  tui = ["colored", "console", "crossterm", "indicatif", "ratatui", "tui-input"]
  unicode-support = ["unicode-normalization"]
  warp-integration = ["warp"]
  web-gui = ["askama", "axum", "serde_urlencoded", "tower", "tower-http"]

  # Enhanced performance and observability
  config-hot-reload = ["notify"]
  enhanced-observability = [
    "futures",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry-prometheus",
    "tokio-stream",
    "tracing-opentelemetry",
  ]
  event-sourcing = ["futures", "notify", "tokio-stream"]
  performance-optimization = [
    "bumpalo",
    "metrics",
    "metrics-prometheus",
    "object-pool",
    "prometheus",
  ]
  tiered-storage = ["postgres-storage", "redis"]

  # SMSKit integration (next-generation SMS support)
  smskit = [
    "sms-core",
    "sms-plivo",
    "sms-twilio",
    "sms-web-generic",
  ]
  smskit-web-axum = ["axum-integration", "sms-web-axum", "smskit"]

  # AES-GCM encryption (always on — required by storage encryption and JARM)
  [dependencies.aes-gcm]
    version = "0.10.3"

  [dependencies.chacha20poly1305]
    optional = true
    version  = "0.10"

  [dependencies.x25519-dalek]
    optional = true
    version  = "2.0"
    features = ["static_secrets"]

  [dependencies.ed25519-dalek]
    features = ["rand_core"]
    optional = true
    version  = "2.2.0"

  # Optional: pulled in by `fips-compliance`, and by `rsa-verify`/
  # `rsa-private-key-ops` for RSA JWKS export (tokens/mod.rs) and JARM
  # RSA-OAEP JWE (oidc_advanced_jarm.rs) respectively -- not subject to
  # RUSTSEC-2023-0071 (AWS-LC's own RSA implementation, not the `rsa`
  # crate's). `ring-io` (default-on) is required for RsaPublicKey's
  # modulus()/exponent() accessors used by the JWKS export path.
  [dependencies.aws-lc-rs]
    features = ["aws-lc-sys"]
    optional = true
    version  = "1.14.1"

  [dependencies.parking_lot]
    version = "0.12.5"

