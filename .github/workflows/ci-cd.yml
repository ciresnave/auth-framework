# GitHub Actions CI/CD Pipeline for AuthFramework v0.5.x

name: AuthFramework CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration -- -D warnings

      - name: Run all tests (lib + integration)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        # admin-binary and sqlite-storage added (PM ruling,
        # auth-framework#119 rounds 4-5): every test in src/admin is
        # gated on admin-binary, and several of those (the CLI
        # encrypt-kv tests against a real backend, and the pre-existing
        # admin maintenance smoke test) are ADDITIONALLY gated on
        # sqlite-storage specifically -- without both features, this
        # required job never compiled or ran them (only the separate,
        # also-required Coverage job's --all-features did, so they were
        # not entirely uncovered, but this job's own log couldn't show
        # them passing or failing). Deliberately NOT added to the "Run
        # Clippy" step above: that would also pull in src/admin/web.rs
        # under clippy's stricter lints, newly failing this job on the
        # pre-existing, already filed, unrelated issue #120
        # (unwrap_used/await_holding_lock).
        run: cargo test --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration,admin-binary,sqlite-storage --workspace

      # tests/storage_postgres.rs and tests/storage_redis.rs are #[ignore]d
      # (cargo's convention for tests needing an external service) and were
      # never actually run here despite this job provisioning healthy
      # postgres/redis services for them (issue #17). Split into two steps
      # (not one `run: |` block) so a failure in one does not stop the other
      # from running and reporting under GitHub Actions' default `bash -e`
      # shell.
      - name: Run ignored postgres storage integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        # --test-threads=1: PostgresStorage::migrate() is not safe under
        # concurrent execution (duplicate-key races on Postgres's own
        # pg_type_typname_nsp_index catalog index when two connections both
        # run CREATE TABLE IF NOT EXISTS at once) -- see issue #89, which
        # this works around rather than fixes. A real fix removes the need
        # for this flag.
        #
        # --skip pg_cleanup_expired/pg_token_crud/pg_token_update: these 3
        # fail with "no column found for name: user_profile" -- see issue
        # #93 (AuthToken.user_profile never round-trips through any storage
        # backend; Postgres is the only one that hard-errors about it
        # instead of silently dropping it). NOTE: the tests are also marked
        # #[ignore = "..."] in source for documentation, but that alone does
        # NOT exclude them here -- `-- --ignored` runs every #[ignore]d
        # test by design, reason string or not. --skip is what actually
        # excludes them from this invocation.
        #
        # --skip pg_concurrent_migrate_is_safe: this one is SUPPOSED to fail
        # right now -- it's the regression test proving issue #89
        # (PostgresStorage::migrate() is not concurrency-safe) is still
        # unfixed. --test-threads=1 only serializes separate #[test]
        # functions against each other; it does nothing to stop this one
        # test from spawning its own 8 concurrent migrate() calls
        # internally, which is the whole point of the test. Same
        # --skip-not-#[ignore] mistake as above, caught the same way.
        run: cargo test --test storage_postgres --features postgres-storage -- --ignored --test-threads=1 --skip pg_cleanup_expired --skip pg_token_crud --skip pg_token_update --skip pg_concurrent_migrate_is_safe

      # if: always() -- GitHub Actions skips a step by default once an
      # earlier step in the job fails, so without this the redis tests
      # would silently never run again any time the postgres step fails for
      # any reason (exactly the kind of invisible skip issue #17 was about).
      - name: Run ignored redis storage integration tests
        if: always()
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --test storage_redis --features redis-storage -- --ignored

      - name: Verify examples compile
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --examples --no-run --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration

      - name: Verify benchmarks compile
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo bench --no-run

  msrv:
    name: MSRV Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Check MSRV build and tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --lib --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration

  minimal-profile:
    name: Minimal Profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-minimal-${{ hashFiles('**/Cargo.lock') }}

      - name: Check minimal profile
        run: cargo check --lib --no-default-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Collect coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            features: api-server,postgres-storage,redis-storage
          - name: storage-backends
            features: api-server,postgres-storage,sqlite-storage,redis-storage,tiered-storage,distributed-rate-limiting
          - name: api-integrations
            features: api-server,postgres-storage,redis-storage,axum-integration,actix-integration,warp-integration,openid-connect
          - name: admin-surfaces
            features: api-server,postgres-storage,redis-storage,cli,tui,web-gui,admin-binary
          - name: enterprise-auth
            features: api-server,postgres-storage,redis-storage,enhanced-rbac,enhanced-device-flow,ldap-auth,otp-auth,passkeys,saml,unicode-support
          - name: observability-performance
            features: api-server,postgres-storage,redis-storage,config-hot-reload,enhanced-observability,event-sourcing,performance-optimization
          - name: crypto-sms-test
            features: api-server,postgres-storage,redis-storage,axum-integration,enhanced-crypto,fips-compliance,smskit,smskit-web-axum,docker-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Compile feature group
        shell: bash
        run: |
          cargo check --lib --tests --bins --examples --no-default-features --features "${{ matrix.features }}"

      # This matrix entry is the only one carrying `saml`, and until now
      # nothing in CI actually RAN the saml test suite (only compiled it
      # above) -- `cargo check --tests` proves the tests build, not that
      # they pass. SAML's tests are self-contained (no DB/redis needed), so
      # this is safe to run for just this one matrix entry rather than
      # widening it to every group above, several of which assume services
      # this job doesn't provide.
      - name: Run SAML tests
        if: matrix.name == 'enterprise-auth'
        shell: bash
        run: |
          cargo test --lib --no-default-features --features "${{ matrix.features }}" 'api::saml::tests::'

  security-audit-advisories:
    name: Security Audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  security-audit-deny:
    name: Security Audit (deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny --all-features check

  security-audit-rsa-absence:
    name: Security Audit (rsa absence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `rsa` (RUSTSEC-2023-0071, the Marvin Attack, no fixed upgrade
      # available) must be ABSENT from every feature combination this repo
      # ships. There are no exemptions: `saml` is rsa-free since bergshamra
      # 0.9.2 (aws-lc backend, #105) and `openid-connect` is a no-op alias
      # since the unused `openidconnect` dependency was removed (#113).
      #
      # `cargo tree -i rsa` exits NONZERO with "did not match any packages"
      # when the crate is absent -- that is the PASS condition here,
      # inverted from normal CI exit-code conventions. Match on the actual
      # stdout/stderr text, not the exit code alone, or this gate silently
      # inverts itself.
      #
      # Self-test: before the real checks, the same `check` function is run
      # against two throwaway crates built here: one that depends on `rsa`
      # (MUST report FOUND) and one that does not (MUST report OK). If either
      # answer is wrong the gate is blind or inverted (e.g. the match text
      # drifted) and the step fails. The control no longer depends on any
      # feature of this crate, so it cannot go stale when features change.
      - name: Assert rsa is absent from shipped, non-exempt feature combinations
        shell: bash
        run: |
          set -o pipefail
          fail=0
          # check <name> <features> -> returns 0 if rsa is absent, 1 if rsa
          # was FOUND (prints the matched `rsa vX.Y.Z` line), 2 if cargo
          # itself errored (neither a clean absence nor an rsa tree).
          check() {
            local name="$1"
            local features="$2"
            local dir="${3:-.}"
            local out
            if [ -z "$features" ]; then
              out=$(cd "$dir" && cargo tree -i rsa --target all 2>&1) || true
            elif [ "$features" = "__ALL__" ]; then
              out=$(cd "$dir" && cargo tree -i rsa --target all --all-features 2>&1) || true
            else
              out=$(cd "$dir" && cargo tree -i rsa --target all --no-default-features --features "$features" 2>&1) || true
            fi
            if echo "$out" | grep -q "did not match any packages\|nothing to print"; then
              echo "OK: rsa absent for '$name'"
              return 0
            fi
            if echo "$out" | grep -qE '^rsa v[0-9]'; then
              echo "FOUND: rsa present for '$name': $(echo "$out" | grep -E '^rsa v[0-9]' | head -1)"
              echo "$out"
              return 1
            fi
            echo "ERROR: unexpected cargo-tree output for '$name':"
            echo "$out"
            return 2
          }
          # Self-test controls: throwaway crates outside this workspace.
          mkcrate() { # <dir> <extra dependency lines>
            mkdir -p "$1/src"
            : > "$1/src/lib.rs"
            {
              echo '[package]'
              echo 'name = "rsa-gate-control"'
              echo 'version = "0.0.0"'
              echo 'edition = "2021"'
              echo '[dependencies]'
              echo "$2"
            } > "$1/Cargo.toml"
          }
          ctl_with=$(mktemp -d)
          ctl_without=$(mktemp -d)
          mkcrate "$ctl_with" 'rsa = "0.9"'
          mkcrate "$ctl_without" ''
          # The control that HAS rsa MUST return 1 (rsa FOUND): not 0 (blind)
          # and not 2 (cargo errored, which proves nothing).
          st=0
          check "self-test: throwaway crate depending on rsa" "" "$ctl_with" || st=$?
          if [ "$st" -ne 1 ]; then
            echo "SELF-TEST FAILED: expected 'rsa found' (1) for the crate that depends on rsa, got $st"
            exit 1
          fi
          # The control WITHOUT rsa MUST return 0 (rsa absent).
          st=0
          check "self-test: throwaway crate without rsa" "" "$ctl_without" || st=$?
          if [ "$st" -ne 0 ]; then
            echo "SELF-TEST FAILED: expected 'rsa absent' (0) for the crate without rsa, got $st"
            exit 1
          fi
          echo "self-test passed: gate reports FOUND for a crate depending on rsa and OK for one without"
          run() { check "$@" || fail=1; }
          run "default" ""
          run "baseline" "api-server,postgres-storage,redis-storage"
          run "storage-backends" "api-server,postgres-storage,sqlite-storage,redis-storage,tiered-storage,distributed-rate-limiting"
          run "admin-surfaces" "api-server,postgres-storage,redis-storage,cli,tui,web-gui,admin-binary"
          run "observability-performance" "api-server,postgres-storage,redis-storage,config-hot-reload,enhanced-observability,event-sourcing,performance-optimization"
          run "crypto-sms-test" "api-server,postgres-storage,redis-storage,axum-integration,enhanced-crypto,fips-compliance,smskit,smskit-web-axum,docker-tests"
          run "saml" "saml"
          run "saml-api" "api-server,saml"
          run "openid-connect (no-op alias)" "openid-connect"
          run "all features" "__ALL__"
          exit $fail

  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs:
      [
        test,
        msrv,
        coverage,
        feature-matrix,
        security-audit-advisories,
        security-audit-deny,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: testing
          push: false
          tags: authframework:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker tests
        run: |
          docker run --rm authframework:test

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: authframework:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR's base commit object (not just the merge ref) to
          # build and bench it as the "base" side of the comparison below.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      # A criterion baseline cached across separate workflow runs compares
      # runs that may have executed on different runner VMs -- noise far
      # above criterion's own regression threshold, which makes the gate
      # fire on unrelated PRs (see auth-framework#119's round-5 review).
      # Instead, build and bench the PR's base commit in a worktree that
      # shares this job's own target dir, so both sides of the comparison
      # run back-to-back on this same runner.
      - name: Benchmark base commit (same runner)
        shell: bash -eo pipefail {0}
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git worktree add /tmp/base-checkout "$base_sha"
          (cd /tmp/base-checkout && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench --bench auth_performance -- --save-baseline base --noise-threshold 0.20)
          # Kept for the repeat-on-exceed step below; removed there.

      # --noise-threshold raises criterion's own relative-change filter from
      # its 1% default to 20%: measured on this job's own runs, same-runner
      # back-to-back benchmarks of an IDENTICAL tree still swing up to ~16%
      # on individual benchmarks (CPU frequency scaling, cache-locality
      # differences between the base and head binaries, shared-tenancy CPU
      # steal) even though criterion's significance test (p < 0.05) often
      # calls that swing "significant" -- it's real noise, just not random
      # noise. 20% gives headroom above the worst noise observed here while
      # still catching a genuine regression by a wide margin (demonstrated
      # below with a deliberate multi-hundred-percent slowdown).
      - name: Run performance benchmarks
        shell: bash -eo pipefail {0}
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: |
          cargo bench --bench auth_performance -- --baseline base --noise-threshold 0.20 2>&1 | tee benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

      # A single microbenchmark at any fixed percentage threshold produces
      # the occasional false red. So a benchmark that exceeds the threshold
      # is re-measured (base AND head, same runner, same job) up to 3 times
      # and fails the gate only if EVERY repeat also regresses. A genuine
      # regression regresses on every repeat; noise does not.
      - name: Performance regression check
        shell: bash -eo pipefail {0}
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: |
          # Criterion prints its own verdict ("Performance has regressed.")
          # right after the benchmark's "change:" line; the benchmark name is
          # on the "time:" line or the line above it. Match the verdict
          # rather than reconstructing the sign convention from "change:".
          regressed_names() {
            awk '
              /time:[[:space:]]*\[/ {
                n = $0; sub(/[[:space:]]*time:.*/, "", n)
                if (n == "") n = prev
                cur = n
              }
              /Performance has regressed/ { print cur }
              { if ($0 !~ /^[[:space:]]/) prev = $0 }
            ' "$1" | sort -u
          }

          mapfile -t suspects < <(regressed_names benchmark_results.txt)
          if [ "${#suspects[@]}" -eq 0 ]; then
            echo "No benchmark exceeded the threshold."
            git worktree remove /tmp/base-checkout --force
            exit 0
          fi
          echo "Exceeded threshold on first run: ${suspects[*]}"

          failed=()
          for name in "${suspects[@]}"; do
            confirmed=true
            for attempt in 1 2 3; do
              echo "::group::repeat $attempt/3: $name"
              (cd /tmp/base-checkout && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"                 cargo bench --bench auth_performance -- --exact "$name" --save-baseline base --noise-threshold 0.20) > /dev/null 2>&1
              cargo bench --bench auth_performance -- --exact "$name" --baseline base --noise-threshold 0.20 > "repeat.txt" 2>&1
              cat repeat.txt
              echo "::endgroup::"
              if [ -z "$(regressed_names repeat.txt)" ]; then
                echo "$name: repeat $attempt did not regress -> noise"
                confirmed=false
                break
              fi
            done
            if $confirmed; then failed+=("$name"); fi
          done
          git worktree remove /tmp/base-checkout --force

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Performance regression detected (regressed on all 3 repeats): ${failed[*]}"
            exit 1
          fi
          echo "All first-run exceedances cleared on repeat (noise)."

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, performance]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: authframework
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to staging
        run: |
          # Update ECS service or Kubernetes deployment
          aws ecs update-service --cluster staging --service authframework --force-new-deployment

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: authframework
          IMAGE_TAG: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to production
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Blue-green deployment with rollback capability
          aws ecs update-service --cluster production --service authframework --task-definition authframework:$VERSION

      - name: Run smoke tests
        run: |
          # Wait for deployment to complete
          sleep 60

          # Run smoke tests against production
          curl -f https://api.authframework.com/health || exit 1

          # Test authentication flow
          curl -f -X POST https://api.authframework.com/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test@example.com","password":"test"}' || exit 1

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Check Slack webhook configured
        id: slack_check
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack notification
        if: steps.slack_check.outputs.configured == 'true'
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: ${{ job.status }}
          channel: "#deployments"
          fields: repo,message,commit,author,action,eventName,ref,workflow

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Clean up old artifacts
        run: |
          # Cleanup old Docker images, test artifacts, etc.
          echo "Cleanup completed"
