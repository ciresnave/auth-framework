# GitHub Actions CI/CD Pipeline for AuthFramework v0.5.x

name: AuthFramework CI/CD

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  release:
    types: [published]

# Least privilege: jobs that need more raise it themselves (see their permissions blocks).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    services:
      postgres:
        image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration -- -D warnings

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --locked --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration --workspace

      - name: Verify examples compile
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --locked --examples --no-run --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration

      - name: Run benchmarks
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo bench --locked --no-run

  msrv:
    name: MSRV Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Check MSRV build and tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo test --locked --lib --features enhanced-rbac,postgres-storage,redis-storage,openid-connect,axum-integration

  minimal-profile:
    name: Minimal Profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-minimal-${{ hashFiles('**/Cargo.lock') }}

      - name: Check minimal profile
        run: cargo check --locked --lib --no-default-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Collect coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            features: api-server,postgres-storage,redis-storage
          - name: storage-backends
            features: api-server,postgres-storage,sqlite-storage,redis-storage,tiered-storage,distributed-rate-limiting
          - name: api-integrations
            features: api-server,postgres-storage,redis-storage,axum-integration,actix-integration,warp-integration,openid-connect
          - name: admin-surfaces
            features: api-server,postgres-storage,redis-storage,cli,tui,web-gui,admin-binary
          - name: enterprise-auth
            features: api-server,postgres-storage,redis-storage,enhanced-rbac,enhanced-device-flow,ldap-auth,otp-auth,passkeys,saml,unicode-support
          - name: observability-performance
            features: api-server,postgres-storage,redis-storage,config-hot-reload,enhanced-observability,event-sourcing,performance-optimization
          - name: crypto-sms-test
            features: api-server,postgres-storage,redis-storage,axum-integration,enhanced-crypto,fips-compliance,smskit,smskit-web-axum,docker-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Compile feature group
        shell: bash
        run: |
          cargo check --locked --lib --tests --bins --examples --no-default-features --features "${{ matrix.features }}"

      # This matrix entry is the only one carrying `saml`, and until now
      # nothing in CI actually RAN the saml test suite (only compiled it
      # above) -- `cargo check --tests` proves the tests build, not that
      # they pass. SAML's tests are self-contained (no DB/redis needed), so
      # this is safe to run for just this one matrix entry rather than
      # widening it to every group above, several of which assume services
      # this job doesn't provide.
      - name: Run SAML tests
        if: matrix.name == 'enterprise-auth'
        shell: bash
        run: |
          cargo test --locked --lib --no-default-features --features "${{ matrix.features }}" 'api::saml::tests::'

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny --all-features check

  security-audit-rsa-absence:
    name: Security Audit (rsa absence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # `rsa` (RUSTSEC-2023-0071, the Marvin Attack, no fixed upgrade
      # available) must be ABSENT from every feature combination this repo
      # ships by default, except the two features that still have their own
      # tracked, separate exception: `saml` (bergshamra's `KeyData::Rsa`
      # path on bergshamra 0.3.x, see #105's history) and `openid-connect`
      # (the `openidconnect` crate itself has a hard, non-optional
      # dependency on `rsa` -- see #113). Both are deliberately excluded
      # from the combos checked below, not overlooked.
      #
      # `cargo tree -i rsa` exits NONZERO with "did not match any packages"
      # when the crate is absent -- that is the PASS condition here,
      # inverted from normal CI exit-code conventions. Match on the actual
      # stdout/stderr text, not the exit code alone, or this gate silently
      # inverts itself.
      - name: Assert rsa is absent from shipped, non-exempt feature combinations
        shell: bash
        run: |
          set -o pipefail
          fail=0
          check() {
            local name="$1"
            local features="$2"
            local out
            if [ -z "$features" ]; then
              out=$(cargo tree -i rsa 2>&1) && status=0 || status=$?
            else
              out=$(cargo tree -i rsa --no-default-features --features "$features" 2>&1) && status=0 || status=$?
            fi
            if echo "$out" | grep -q "did not match any packages\|nothing to print"; then
              echo "OK: rsa absent for '$name'"
            else
              echo "FAIL: rsa present (or unexpected cargo-tree error) for '$name':"
              echo "$out"
              fail=1
            fi
          }
          check "default" ""
          check "baseline" "api-server,postgres-storage,redis-storage"
          check "storage-backends" "api-server,postgres-storage,sqlite-storage,redis-storage,tiered-storage,distributed-rate-limiting"
          check "admin-surfaces" "api-server,postgres-storage,redis-storage,cli,tui,web-gui,admin-binary"
          check "observability-performance" "api-server,postgres-storage,redis-storage,config-hot-reload,enhanced-observability,event-sourcing,performance-optimization"
          check "crypto-sms-test" "api-server,postgres-storage,redis-storage,axum-integration,enhanced-crypto,fips-compliance,smskit,smskit-web-axum,docker-tests"
          exit $fail

  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: [test, msrv, coverage, feature-matrix, security-audit]
    # The image's tests run with every feature, and the PostgreSQL and Redis ones need real servers.
    services:
      postgres:
        image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: testing
          push: false
          load: true
          tags: authframework:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker tests
        run: |
          docker run --rm --network host             -e DATABASE_URL=postgresql://test_user:test_password@localhost:5432/auth_framework_test             -e REDIS_URL=redis://localhost:6379             authframework:test

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: authframework:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: auth_framework_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Run performance benchmarks
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_framework_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_that_is_longer_than_32_characters_for_security
        run: |
          cargo bench --locked --bench auth_performance 2>&1 | tee benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark_results.txt

      - name: Performance regression check
        run: |
          # Check if any benchmark shows >10% performance degradation
          if grep -q "change:.*-[1-9][0-9]\%" benchmark_results.txt; then
            echo "Performance regression detected!"
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, performance]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: authframework
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to staging
        run: |
          # Update ECS service or Kubernetes deployment
          aws ecs update-service --cluster staging --service authframework --force-new-deployment

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: authframework
          IMAGE_TAG: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -f Dockerfile --target runtime -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to production
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Blue-green deployment with rollback capability
          aws ecs update-service --cluster production --service authframework --task-definition authframework:$VERSION

      - name: Run smoke tests
        run: |
          # Wait for deployment to complete
          sleep 60

          # Run smoke tests against production
          curl -f https://api.authframework.com/health || exit 1

          # Test authentication flow
          curl -f -X POST https://api.authframework.com/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test@example.com","password":"test"}' || exit 1

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Slack notification
        # no webhook configured (forks, release lines): skip instead of failing
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: ${{ job.status }}
          channel: "#deployments"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Clean up old artifacts
        run: |
          # Cleanup old Docker images, test artifacts, etc.
          echo "Cleanup completed"
