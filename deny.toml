# Cargo-deny configuration for AuthFramework
# Security-first configuration for authentication framework

[graph]
    # Without this, cargo-deny only resolves the graph for the CI runner's own
    # target (x86_64-unknown-linux-gnu on ubuntu-latest) -- any Windows-only
    # dependency or advisory is invisible by construction, not by decision.
    # x86_64-pc-windows-msvc added because CireSnave develops on Windows.
    # aarch64-apple-darwin deliberately NOT added: no macOS build target, CI
    # job, or platform-specific code exists in this repo today: nothing to
    # check yet, and padding the target list only slows the check.
    targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
    # Vulnerability database settings
    db-path = "~/.cargo/advisory-db"
    db-urls = ["https://github.com/RustSec/advisory-db"]

    # Security-first approach: Only allow explicitly documented exceptions
    # This forces explicit review and justification of ALL security issues
    ignore = [
        # RUSTSEC-2023-0071 (rsa, Marvin Attack, no patched release): the
        # ignore that used to be here was removed because `rsa` is no longer in
        # Cargo.lock at all (jsonwebtoken and JARM moved to aws-lc-rs, saml to
        # bergshamra's aws-lc backend, mysql-storage was dropped, the unused
        # `openidconnect` dependency was removed in #113, and sqlx 0.9 no longer
        # lists sqlx-mysql's rsa). The "Security Audit (rsa absence)" CI job
        # keeps it out of the dependency graph for every shipped feature set.
        # RUSTSEC-2024-0449 (unsafe-libyaml unmaintained) and RUSTSEC-2026-0258 (h2 unbounded
        # empty DATA frames) are not listed: serde_yaml was replaced by serde-saphyr, and
        # actix-web is used without its default `http2` feature, so neither crate is in
        # Cargo.lock any more. The ban below keeps a vulnerable h2 from coming back.
        # RUSTSEC-2026-0374 (basic-toml unmaintained, no safe upgrade): it is a build-time dependency of
        # askama_derive 0.16.1 -- the newest askama -- which only the `web-gui` feature (the admin web UI's
        # templates) enables. It is a proc-macro dependency: it parses template config at compile time and
        # is not linked into any built artifact. Nothing in this crate calls it; remove this entry when
        # askama stops depending on it.
        { id = "RUSTSEC-2026-0374", reason = "build-time proc-macro dependency of the newest askama; web-gui only; not linked into artifacts" },
        # RUSTSEC-2026-0440 (astral-tokio-tar unmaintained, "No safe upgrade is available"; Astral ended
        # maintenance 2026-11-03): pulled only by testcontainers 0.28.0 -- the newest release, checked on
        # crates.io 2026-11-05 -- which only the optional `docker-tests` feature enables (integration tests
        # against Docker; never part of a shipped build). Owner: auth-framework lane. Remove this entry when
        # testcontainers releases a version that no longer depends on astral-tokio-tar (`cargo tree -i
        # astral-tokio-tar --all-features` is then empty), or when `docker-tests` is dropped.
        { id = "RUSTSEC-2026-0440", reason = "unmaintained, no safe upgrade; only via testcontainers 0.28.0 (newest) behind the test-only docker-tests feature; remove when testcontainers drops it" },
        # RUSTSEC-2026-0459 (libsqlite3-sys: bundled SQLite CVE-2026-119375; fixed in libsqlite3-sys >=0.39.0).
        # EXPIRES 2026-12-09 (dated by the PM 2026-11-09): re-check then; do not extend without a new decision.
        # Exposed only if we open a SQLite file plus a sibling -wal written by a less trusted party; our
        # storage files are our own. Only via sqlx-sqlite 0.9.0 (newest release), which caps libsqlite3-sys
        # below 0.38. Upstream already merged the cap bump (transact-rs/sqlx#4502, 2026-11-08) but has not
        # released it; remove this entry when a sqlx release carrying it is in Cargo.lock.
        { id = "RUSTSEC-2026-0459", reason = "bundled SQLite CVE; only exposed to a SQLite file plus -wal from a less trusted party; our files are our own; sqlx 0.9.0 caps libsqlite3-sys <0.38, fix merged upstream (transact-rs/sqlx#4502) unreleased; expires 2026-12-09" },
    ]

[licenses]
    # License policy - allow common open source licenses
    allow = [
        "Apache-2.0 WITH LLVM-exception",
        "Apache-2.0",
        "BSD-2-Clause",
        "BSD-3-Clause",
        "CDLA-Permissive-2.0",            # Community Data License Agreement - for webpki-roots
        "0BSD",                           # BSD Zero Clause License - public-domain-equivalent, for quoted_printable (via lettre)
        # CC0-1.0 - public-domain-equivalent dedication, for tiny-keccak/notify.
        # CireSnave 2026-09-17: "Allow both, note the CC0 caveat" -- the caveat
        # is that CC0-1.0 does not grant patent rights the way Apache-2.0 does;
        # accepted portfolio-wide, not just for this crate set.
        "CC0-1.0",
        # BSL-1.0 - the BOOST Software License, for xxhash-rust (via redis).
        # NOT BUSL-1.1 (Business Source License) -- one character apart in the
        # name, but Boost is permissive and OSI-approved (MIT/Apache family)
        # while BUSL-1.1 is source-available, not open source. CireSnave
        # ruled on this distinction explicitly (2026-09-24): allow BSL-1.0.
        "BSL-1.0",
        "ISC",
        "MIT",
        "MPL-2.0",                        # Mozilla Public License 2.0 - weak copyleft, commercial-friendly
        "Unicode-3.0",                    # Unicode License v3 - for ICU components
        "Zlib",                           # Zlib license - very permissive, commercial-friendly
    ]
    # Confidence threshold for license detection
    confidence-threshold = 0.8

[bans]
    # Crate banning rules
    highlight         = "all"   # Highlight all issues
    multiple-versions = "warn"  # Allow multiple versions but warn
    wildcards         = "allow" # Allow wildcard dependencies

    # No h2 below the RUSTSEC-2026-0258 fix (0.4.16) anywhere in the graph (hyper, reqwest, tonic,
    # actix-http with its `http2` feature, ...).
    deny = [
        { name = "h2", version = "<0.4.16" },
    ]

[sources]
    # Source repository settings
    allow-git        = []
    allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
    unknown-git      = "warn"                                           # Warn about unknown git sources
    unknown-registry = "warn"                                           # Warn about unknown registries
