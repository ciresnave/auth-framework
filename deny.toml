# Cargo-deny configuration for AuthFramework
# Security-first configuration for authentication framework

[advisories]
    # Vulnerability database settings
    db-path = "~/.cargo/advisory-db"
    db-urls = ["https://github.com/RustSec/advisory-db"]

    # Security-first approach: Only allow explicitly documented exceptions
    # This forces explicit review and justification of ALL security issues
    ignore = [
        # RUSTSEC-2023-0071 (rsa, Marvin Attack, no patched release): the ignore that
        # used to be here was removed because `rsa` is no longer in Cargo.lock at all
        # (jsonwebtoken moved to aws-lc-rs, saml to bergshamra's aws-lc backend,
        # mysql-storage was dropped, and sqlx 0.9 no longer lists sqlx-mysql's rsa).
        # The "Security Audit (rsa absence)" CI job keeps it out of the dependency
        # graph for every shipped feature set.
        # `paste` crate unmaintained - transitive dependency via cryptoki 0.7.0
        # Impact: None; `paste` is a compile-time macro crate with no runtime attack surface
        # Tracking: Will resolve when cryptoki drops `paste` or migrates to an alternative
        "RUSTSEC-2024-0436",
        # `unsafe-libyaml` unmaintained (RUSTSEC-2024-0449), via serde_yaml 0.9, which this
        # line uses directly for YAML config (src/admin/cli.rs, src/config, src/deployment).
        # Impact: none known; it is an unmaintained notice, not a vulnerability. Main replaced
        # serde_yaml with serde-saphyr, a source change not made on this release line.
        "RUSTSEC-2024-0449",
        # `basic-toml` unmaintained (RUSTSEC-2026-0374, no safe upgrade): a build-time proc-macro
        # dependency of askama_derive, which only the `web-gui` feature enables. The newest askama
        # (0.16.1) still depends on it, so bumping this line's askama 0.15 would not remove it. Nothing
        # is linked into a built artifact. Remove when askama drops it.
        "RUSTSEC-2026-0374",
        # RUSTSEC-2026-0440 (`astral-tokio-tar` unmaintained, "No safe upgrade is available"; Astral
        # ended maintenance 2026-11-03): pulled only by testcontainers 0.27.2 (`cargo tree -i
        # astral-tokio-tar --all-features`), which only the optional `docker-tests` feature enables
        # (integration tests against Docker; never part of a shipped build). The newest testcontainers
        # (0.28.0, crates.io 2026-11-05) still depends on it, so bumping does not remove it.
        # Owner: auth-framework lane. Remove this entry when testcontainers releases a version that no
        # longer depends on astral-tokio-tar, or when `docker-tests` is dropped.
        "RUSTSEC-2026-0440",
        # RUSTSEC-2026-0543 (chrono 0.4.44 unmaintained) and RUSTSEC-2026-0555 (chrono-tz 0.10.4 unmaintained), both
        # "No safe upgrade is available": maintenance advisories, not vulnerabilities (same decision as `main`, #499,
        # pm-platform 2026-11-19). EXPIRES 2026-12-17. chrono is pulled in by sqlx-core/sqlx-postgres, role-system,
        # tokio-cron-scheduler and expect-json, chrono-tz by role-system and tokio-cron-scheduler, so leaving it in
        # our own code would not remove it. At the expiry take any release of those that drops chrono, else renew
        # with a new date and the blocking dependency named.
        "RUSTSEC-2026-0543",
        "RUSTSEC-2026-0555",
    ]

[licenses]
    # License policy - allow common open source licenses
    allow = [
        "Apache-2.0 WITH LLVM-exception",
        "0BSD",                           # BSD Zero Clause; fully permissive
        "Apache-2.0",
        "BSD-2-Clause",
        "BSD-3-Clause",
        "BSL-1.0",                        # Boost Software License; permissive (xxhash-rust)
        "CC0-1.0",                        # notify, tiny-keccak; public-domain dedication
        "CDLA-Permissive-2.0",            # Community Data License Agreement - for webpki-roots
        "ISC",
        "MIT",
        "MPL-2.0",                        # Mozilla Public License 2.0 - weak copyleft, commercial-friendly
        "Unicode-3.0",                    # Unicode License v3 - for ICU components
        "Zlib",                           # Zlib license - very permissive, commercial-friendly
    ]
    # Confidence threshold for license detection
    confidence-threshold = 0.8

[bans]
    # Crate banning rules
    highlight         = "all"   # Highlight all issues
    multiple-versions = "warn"  # Allow multiple versions but warn
    wildcards         = "allow" # Allow wildcard dependencies

[sources]
    # Source repository settings
    allow-git        = []
    allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
    unknown-git      = "warn"                                           # Warn about unknown git sources
    unknown-registry = "warn"                                           # Warn about unknown registries
